prefix: FTO-
rules:
  - id: FTO-001
    title: 全面覆盖
    level: must
    source: IPR Training
    check: 逐项比对独立权利要求全部技术特征。
  - id: FTO-002
    title: 专员判定
    level: must
    source: 海拉流程
    check: 相同、等同、不同和风险等级只能由专员确认。
  - id: FTO-003
    title: 法律状态复核
    level: must
    source: 海拉流程
    check: 客户报告导出前重新获取法律状态。
